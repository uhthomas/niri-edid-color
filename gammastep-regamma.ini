; Final linear-light -> panel-code curve for niri-edid-color.
; This is not a night-light configuration: 6500 K is neutral in GammaStep.
[general]
temp-day=6500
temp-night=6500
fade=0
brightness=1.0
gamma=2.2
location-provider=manual
adjustment-method=wayland

; Day and night use the same settings, so the chosen coordinates do not affect
; the output. GammaStep still requires a location provider in continual mode.
[manual]
lat=0.0
lon=0.0

[wayland]
output=eDP-1

